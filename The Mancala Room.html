<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Mancala Room</title>
<style>
  :root {
    --wood-dark: #3b2417;
    --wood-mid: #5a3825;
    --wood-light: #7a4f34;
    --board-dark: #4a3121;
    --board-light: #d9c3a0;
    --brass: #c8a165;
    --brass-bright: #e6c789;
    --crimson: #8e1f2b;
    --crimson-dark: #5c1219;
    --crimson-light: #b13744;
    --ebony: #1a1a1a;
    --ebony-light: #3a3a3a;
    --parchment: #ece0c8;
    --felt: #14231b;
    --shadow: rgba(0,0,0,0.55);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: radial-gradient(ellipse at center, #2a1a10 0%, #100a06 100%);
    font-family: 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
    color: var(--parchment);
    overflow-x: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 60px;
    min-height: 100%;
  }

  .room-glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse 900px 600px at 50% 30%, rgba(200,161,101,0.08), transparent 70%);
    z-index: 0;
  }

  header { text-align: center; margin-bottom: 6px; position: relative; z-index: 1; }

  h1 {
    font-family: 'Didot', 'Bodoni MT', Georgia, serif;
    font-size: 2.6rem;
    letter-spacing: 0.12em;
    margin: 0;
    color: var(--brass-bright);
    text-shadow: 0 2px 12px rgba(200,161,101,0.35), 0 1px 0 rgba(0,0,0,0.6);
    font-weight: 400;
  }
  h1 .accent { color: var(--crimson-light); }

  .subtitle {
    margin: 6px 0 0;
    font-size: 0.85rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #a89476;
    opacity: 0.85;
  }

  .divider {
    width: 220px;
    height: 1px;
    margin: 18px auto 22px;
    background: linear-gradient(90deg, transparent, var(--brass), transparent);
    position: relative;
    z-index: 1;
  }

  .layout {
    display: flex;
    gap: 32px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
    position: relative;
    z-index: 1;
  }

  .board-frame {
    padding: 18px;
    background: linear-gradient(160deg, var(--wood-light), var(--wood-dark) 60%, #241408);
    border-radius: 14px;
    box-shadow: 0 20px 50px var(--shadow), inset 0 0 0 2px rgba(200,161,101,0.25), inset 0 0 30px rgba(0,0,0,0.5);
    position: relative;
  }
  .board-frame::before {
    content: '';
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(200,161,101,0.35);
    border-radius: 10px;
    pointer-events: none;
  }

  #board {
    display: grid;
    grid-template-columns: 96px repeat(6, minmax(56px, 74px)) 96px;
    grid-template-rows: repeat(2, minmax(80px, 100px));
    gap: 10px;
    background: linear-gradient(160deg, #2e1c11, #1c1109);
    border-radius: 8px;
    padding: 12px;
    box-shadow: inset 0 0 0 3px #241408, inset 0 4px 18px rgba(0,0,0,0.6);
  }

  .pit {
    position: relative;
    border-radius: 50%;
    background: radial-gradient(ellipse at 35% 30%, #3a2718, var(--felt) 70%, #0c1410 100%);
    box-shadow: inset 0 6px 14px rgba(0,0,0,0.7), inset 0 -2px 6px rgba(200,161,101,0.08), 0 2px 4px rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
    transition: box-shadow 0.15s ease;
  }
  .pit.own { cursor: pointer; }
  .pit.own:hover { box-shadow: inset 0 6px 14px rgba(0,0,0,0.7), 0 0 0 2px rgba(230,199,137,0.5), 0 2px 4px rgba(0,0,0,0.4); }
  .pit.playable::after {
    content: '';
    position: absolute;
    top: 6px; left: 6px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--brass-bright);
    box-shadow: 0 0 8px rgba(230,199,137,0.8);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { transform: scale(0.85); opacity: 0.7; } 50% { transform: scale(1.15); opacity: 1; } }

  .store {
    grid-row: 1 / 3;
    border-radius: 16px;
    background: radial-gradient(ellipse at 35% 25%, #3a2718, var(--felt) 70%, #0c1410 100%);
    box-shadow: inset 0 6px 18px rgba(0,0,0,0.7), inset 0 -2px 6px rgba(200,161,101,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .marbles {
    display: flex;
    flex-wrap: wrap;
    align-content: center;
    justify-content: center;
    gap: 3px;
    max-width: 90%;
    padding: 4px;
  }
  .marble {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, var(--brass-bright), var(--brass) 55%, #8a6a3c 100%);
    box-shadow: 0 1px 2px rgba(0,0,0,0.6), inset 0 1px 2px rgba(255,255,255,0.3);
    flex-shrink: 0;
  }
  .store .marble { width: 13px; height: 13px; }

  .count-badge {
    position: absolute;
    bottom: 4px;
    right: 6px;
    font-size: 0.68rem;
    color: var(--brass-bright);
    background: rgba(10,6,3,0.6);
    border-radius: 8px;
    padding: 1px 5px;
    font-family: 'Palatino Linotype', Georgia, serif;
  }
  .store .count-badge { bottom: 8px; right: 8px; font-size: 0.8rem; }

  .pit-label, .store-label {
    position: absolute;
    top: 4px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #8a7154;
    pointer-events: none;
  }
  .store-label { top: 8px; }

  /* --- Side panel (shared with other rooms) --- */
  .panel { width: 300px; display: flex; flex-direction: column; gap: 18px; }

  .card {
    background: linear-gradient(160deg, rgba(58,36,23,0.85), rgba(20,12,7,0.9));
    border: 1px solid rgba(200,161,101,0.25);
    border-radius: 8px;
    padding: 18px 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .card h2 {
    margin: 0 0 12px;
    font-size: 0.78rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--brass);
    font-weight: 400;
    border-bottom: 1px solid rgba(200,161,101,0.2);
    padding-bottom: 8px;
  }

  .turn-display { display: flex; align-items: center; gap: 12px; font-size: 1.05rem; }
  .turn-dot { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; }
  .turn-dot.you { background: radial-gradient(circle at 32% 28%, var(--crimson-light), var(--crimson-dark)); box-shadow: 0 0 8px rgba(178,55,68,0.6); }
  .turn-dot.opp { background: radial-gradient(circle at 32% 28%, #4a4a4a, #000); box-shadow: 0 0 8px rgba(0,0,0,0.6); }

  .status-line { margin-top: 8px; font-size: 0.85rem; color: #c9b896; min-height: 1.2em; font-style: italic; }

  .tally { display: flex; justify-content: space-between; font-size: 0.95rem; margin-top: 10px; }
  .tally span.n { color: var(--brass-bright); font-weight: bold; }

  select, button { font-family: inherit; font-size: 0.9rem; }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field label { font-size: 0.72rem; letter-spacing: 0.15em; text-transform: uppercase; color: #a89476; }

  select {
    background: #241408;
    color: var(--parchment);
    border: 1px solid rgba(200,161,101,0.35);
    border-radius: 4px;
    padding: 8px 10px;
    cursor: pointer;
  }

  .btn {
    background: linear-gradient(160deg, var(--brass-bright), var(--brass) 60%, #9c7c48);
    color: #241408;
    border: none;
    border-radius: 4px;
    padding: 10px 16px;
    cursor: pointer;
    font-weight: bold;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 0.78rem;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(0,0,0,0.5); }
  .btn:active { transform: translateY(0); }
  .btn.secondary { background: linear-gradient(160deg, #4a3020, #241408); color: var(--parchment); border: 1px solid rgba(200,161,101,0.3); }

  .btn-row { display: flex; gap: 10px; margin-top: 4px; }
  .btn-row .btn { flex: 1; }

  .thinking { display: inline-flex; align-items: center; gap: 6px; color: var(--brass-bright); font-size: 0.8rem; font-style: italic; }
  .thinking .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--brass-bright); animation: blink 1.2s infinite ease-in-out; }
  .thinking .dot:nth-child(2) { animation-delay: 0.2s; }
  .thinking .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

  .log { max-height: 140px; overflow-y: auto; font-size: 0.8rem; color: #b8a888; line-height: 1.6; padding-right: 4px; }
  .log::-webkit-scrollbar { width: 5px; }
  .log::-webkit-scrollbar-thumb { background: rgba(200,161,101,0.3); border-radius: 3px; }
  .log div { border-bottom: 1px dotted rgba(200,161,101,0.12); padding: 2px 0; }

  .overlay { position: fixed; inset: 0; background: rgba(10,6,3,0.82); display: none; align-items: center; justify-content: center; z-index: 10; }
  .overlay.show { display: flex; }
  .overlay-card {
    background: linear-gradient(160deg, var(--wood-light), var(--wood-dark) 70%);
    border: 1px solid var(--brass);
    border-radius: 10px;
    padding: 40px 50px;
    text-align: center;
    box-shadow: 0 30px 80px rgba(0,0,0,0.7);
  }
  .overlay-card h2 { color: var(--brass-bright); font-size: 1.8rem; margin: 0 0 8px; letter-spacing: 0.05em; font-weight: 400; }
  .overlay-card p { color: #c9b896; margin: 0 0 22px; font-style: italic; }

  footer { margin-top: 26px; font-size: 0.72rem; letter-spacing: 0.15em; text-transform: uppercase; color: #6a5a44; position: relative; z-index: 1; }

  @media (max-width: 720px) {
    .layout { flex-direction: column; align-items: center; }
    .panel { width: 100%; max-width: 420px; }
    #board { grid-template-columns: 60px repeat(6, minmax(38px, 50px)) 60px; grid-template-rows: repeat(2, minmax(56px, 72px)); gap: 6px; padding: 8px; }
    .marble { width: 8px; height: 8px; }
    .store .marble { width: 10px; height: 10px; }
  }
</style>
</head>
<body>

<div class="room-glow"></div>

<header>
  <h1>The <span class="accent">Mancala</span> Room</h1>
  <p class="subtitle">A Quiet Game of Counting Houses</p>
</header>
<div class="divider"></div>

<div class="layout">
  <div class="board-frame">
    <div id="board"></div>
  </div>

  <div class="panel">
    <div class="card">
      <h2>The Table</h2>
      <div class="turn-display">
        <div class="turn-dot you" id="turnDot"></div>
        <span id="turnText">Your move</span>
      </div>
      <div class="status-line" id="statusLine">Choose a pit to begin.</div>
      <div class="tally">
        <div>Your store: <span class="n" id="yourStore">0</span></div>
        <div>Opponent's store: <span class="n" id="oppStore">0</span></div>
      </div>
    </div>

    <div class="card">
      <h2>House Rules</h2>
      <div class="field">
        <label for="difficulty">Opponent Skill</label>
        <select id="difficulty">
          <option value="4">Novice</option>
          <option value="7" selected>Club Player</option>
          <option value="9">Sharp</option>
          <option value="11">Master</option>
        </select>
      </div>
      <div class="field">
        <label for="side">You Play As</label>
        <select id="side">
          <option value="A" selected>Near Row (moves first)</option>
          <option value="B">Far Row</option>
        </select>
      </div>
      <div class="btn-row">
        <button class="btn" id="newGameBtn">New Game</button>
        <button class="btn secondary" id="undoBtn">Undo</button>
      </div>
    </div>

    <div class="card">
      <h2>The Ledger</h2>
      <div class="log" id="log"></div>
    </div>
  </div>
</div>

<footer>Est. this evening &middot; Kalah Rules, 4 Seeds a Pit, Capture on Empty</footer>

<div class="overlay" id="overlay">
  <div class="overlay-card">
    <h2 id="overlayTitle">Game Over</h2>
    <p id="overlayText">The house has won the room.</p>
    <button class="btn" id="overlayBtn">Play Again</button>
  </div>
</div>

<script>
(function() {
  'use strict';

  // board[0..5] = A's pits, board[6] = A's store
  // board[7..12] = B's pits, board[13] = B's store
  const STORE_A = 6, STORE_B = 13;

  let board = [];
  let currentPlayer = 'A';
  let humanSide = 'A';
  let aiSide = 'B';
  let history = [];
  let gameOver = false;
  let aiThinking = false;
  let aiDepth = 7;

  const boardEl = document.getElementById('board');
  const statusLine = document.getElementById('statusLine');
  const turnText = document.getElementById('turnText');
  const turnDot = document.getElementById('turnDot');
  const logEl = document.getElementById('log');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');

  function initBoard() {
    const b = new Array(14).fill(0);
    for (let i = 0; i <= 5; i++) b[i] = 4;
    for (let i = 7; i <= 12; i++) b[i] = 4;
    b[STORE_A] = 0;
    b[STORE_B] = 0;
    return b;
  }

  function ownPits(side) { return side === 'A' ? [0,1,2,3,4,5] : [7,8,9,10,11,12]; }
  function ownStore(side) { return side === 'A' ? STORE_A : STORE_B; }
  function oppStore(side) { return side === 'A' ? STORE_B : STORE_A; }
  function otherSide(side) { return side === 'A' ? 'B' : 'A'; }
  function opposite(i) { return 12 - i; }

  function getMoves(b, side) {
    return ownPits(side).filter(i => b[i] > 0);
  }

  // Returns { board, extraTurn, captured, lastPit, captureFrom }
  function applyMove(b, side, pit) {
    const nb = b.slice();
    let seeds = nb[pit];
    nb[pit] = 0;
    let idx = pit;
    const skip = oppStore(side);
    while (seeds > 0) {
      idx = (idx + 1) % 14;
      if (idx === skip) continue;
      nb[idx]++;
      seeds--;
    }

    let extraTurn = false;
    let captured = 0;
    let captureFrom = -1;

    if (idx === ownStore(side)) {
      extraTurn = true;
    } else if (ownPits(side).includes(idx) && nb[idx] === 1) {
      const oppIdx = opposite(idx);
      if (nb[oppIdx] > 0) {
        captured = nb[oppIdx] + 1;
        nb[ownStore(side)] += captured;
        nb[oppIdx] = 0;
        nb[idx] = 0;
        captureFrom = oppIdx;
      }
    }

    // sweep if either side is emptied
    const aEmpty = [0,1,2,3,4,5].every(i => nb[i] === 0);
    const bEmpty = [7,8,9,10,11,12].every(i => nb[i] === 0);
    if (aEmpty || bEmpty) {
      let sumA = 0, sumB = 0;
      for (let i = 0; i <= 5; i++) { sumA += nb[i]; nb[i] = 0; }
      for (let i = 7; i <= 12; i++) { sumB += nb[i]; nb[i] = 0; }
      nb[STORE_A] += sumA;
      nb[STORE_B] += sumB;
    }

    return { board: nb, extraTurn, captured, lastPit: idx, captureFrom };
  }

  function isGameOver(b) {
    return [0,1,2,3,4,5].every(i => b[i] === 0) || [7,8,9,10,11,12].every(i => b[i] === 0);
  }

  function evaluate(b, side) {
    const myStore = ownStore(side), oppSt = oppStore(side);
    const myPits = ownPits(side), oppPits = ownPits(otherSide(side));
    let myReserve = 0, oppReserve = 0;
    for (const i of myPits) myReserve += b[i];
    for (const i of oppPits) oppReserve += b[i];
    return (b[myStore] - b[oppSt]) * 10 + (myReserve - oppReserve) * 0.5;
  }

  function alphaBeta(b, depth, alpha, beta, side, maxSide) {
    if (depth === 0 || isGameOver(b)) {
      return { score: evaluate(b, maxSide) };
    }
    const moves = getMoves(b, side);
    if (moves.length === 0) {
      return { score: evaluate(b, maxSide) };
    }

    let bestMove = null;
    if (side === maxSide) {
      let value = -Infinity;
      for (const m of moves) {
        const { board: nb, extraTurn } = applyMove(b, side, m);
        const nextSide = extraTurn ? side : otherSide(side);
        const result = alphaBeta(nb, depth - 1, alpha, beta, nextSide, maxSide);
        if (result.score > value) { value = result.score; bestMove = m; }
        alpha = Math.max(alpha, value);
        if (alpha >= beta) break;
      }
      return { score: value, move: bestMove };
    } else {
      let value = Infinity;
      for (const m of moves) {
        const { board: nb, extraTurn } = applyMove(b, side, m);
        const nextSide = extraTurn ? side : otherSide(side);
        const result = alphaBeta(nb, depth - 1, alpha, beta, nextSide, maxSide);
        if (result.score < value) { value = result.score; bestMove = m; }
        beta = Math.min(beta, value);
        if (alpha >= beta) break;
      }
      return { score: value, move: bestMove };
    }
  }

  function pickAIMove() {
    const result = alphaBeta(board, aiDepth, -Infinity, Infinity, aiSide, aiSide);
    return result.move;
  }

  function pitLabel(i, side) {
    if (side === 'A') return 'A' + (i + 1);
    return 'B' + (12 - i + 1);
  }

  function renderPit(cellIndex, isStore) {
    const el = document.createElement('div');
    if (isStore) {
      el.className = 'store';
    } else {
      el.className = 'pit';
      const side = ownPits('A').includes(cellIndex) ? 'A' : 'B';
      if (side === currentPlayer && board[cellIndex] > 0 && !gameOver && !aiThinking) {
        el.classList.add('own');
        if (currentPlayer === humanSide) el.classList.add('playable');
      }
      el.dataset.pit = cellIndex;
      el.addEventListener('click', onPitClick);
    }

    const marbles = document.createElement('div');
    marbles.className = 'marbles';
    const count = board[cellIndex];
    const shown = Math.min(count, isStore ? 24 : 12);
    for (let k = 0; k < shown; k++) {
      const m = document.createElement('div');
      m.className = 'marble';
      marbles.appendChild(m);
    }
    el.appendChild(marbles);

    const badge = document.createElement('div');
    badge.className = 'count-badge';
    badge.textContent = count;
    el.appendChild(badge);

    return el;
  }

  function render() {
    boardEl.innerHTML = '';

    const storeB = renderPit(STORE_B, true);
    storeB.style.gridColumn = '1';
    storeB.style.gridRow = '1 / 3';
    boardEl.appendChild(storeB);

    // top row: pits 12,11,10,9,8,7 left to right
    for (let col = 0; col < 6; col++) {
      const pitIndex = 12 - col;
      const cell = renderPit(pitIndex, false);
      cell.style.gridColumn = String(col + 2);
      cell.style.gridRow = '1';
      boardEl.appendChild(cell);
    }

    const storeA = renderPit(STORE_A, true);
    storeA.style.gridColumn = '8';
    storeA.style.gridRow = '1 / 3';
    boardEl.appendChild(storeA);

    // bottom row: pits 0..5 left to right
    for (let col = 0; col < 6; col++) {
      const pitIndex = col;
      const cell = renderPit(pitIndex, false);
      cell.style.gridColumn = String(col + 2);
      cell.style.gridRow = '2';
      boardEl.appendChild(cell);
    }

    turnDot.className = 'turn-dot ' + (currentPlayer === humanSide ? 'you' : 'opp');
    turnText.textContent = (currentPlayer === humanSide ? 'Your move' : "Opponent's move");

    document.getElementById('yourStore').textContent = board[ownStore(humanSide)];
    document.getElementById('oppStore').textContent = board[ownStore(aiSide)];
  }

  function logMsg(msg) {
    const div = document.createElement('div');
    div.textContent = msg;
    logEl.insertBefore(div, logEl.firstChild);
  }

  function onPitClick(e) {
    if (gameOver || aiThinking) return;
    if (currentPlayer !== humanSide) return;

    const pit = parseInt(e.currentTarget.dataset.pit, 10);
    if (!ownPits(humanSide).includes(pit) || board[pit] === 0) return;

    performMove(pit);
  }

  function performMove(pit) {
    history.push({ board: board.slice(), currentPlayer });

    const mover = currentPlayer;
    const result = applyMove(board, mover, pit);
    board = result.board;

    const label = pitLabel(pit, mover);
    const who = mover === humanSide ? 'You' : 'The opponent';
    let msg = `${who} sow${mover === humanSide ? '' : 's'} from ${label}`;
    if (result.captured > 0) msg += ` and capture ${result.captured}`;
    else if (result.extraTurn) msg += ' and land in the store — another turn';
    logMsg(msg + '.');

    if (isGameOver(board)) {
      finishGame();
      return;
    }

    if (!result.extraTurn) {
      currentPlayer = otherSide(currentPlayer);
    }

    render();

    if (currentPlayer === aiSide && !gameOver) {
      aiThinking = true;
      statusLine.innerHTML = 'The opponent is considering <span class="thinking"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>';
      setTimeout(runAITurn, 450);
    } else {
      statusLine.textContent = 'Choose a pit to begin.';
    }
  }

  function runAITurn() {
    if (gameOver) return;
    const move = pickAIMove();
    aiThinking = false;
    if (move === null || move === undefined) {
      finishGame();
      return;
    }
    performMove(move);
  }

  function finishGame() {
    gameOver = true;
    render();
    const yourTotal = board[ownStore(humanSide)];
    const oppTotal = board[ownStore(aiSide)];
    let resultText;
    if (yourTotal > oppTotal) resultText = 'Victory';
    else if (yourTotal < oppTotal) resultText = 'Defeat';
    else resultText = 'A Draw';

    statusLine.textContent = `Final tally — you: ${yourTotal}, opponent: ${oppTotal}.`;
    logMsg(`— Game over. You: ${yourTotal}, opponent: ${oppTotal} —`);

    overlayTitle.textContent = resultText;
    overlayText.textContent = resultText === 'A Draw'
      ? `Both sides gathered ${yourTotal} seeds.`
      : (resultText === 'Victory'
        ? `You have won the room, ${yourTotal} seeds to ${oppTotal}.`
        : `The opponent has won the room, ${oppTotal} seeds to ${yourTotal}.`);
    overlay.classList.add('show');
  }

  function undo() {
    if (aiThinking || history.length === 0) return;
    let snap = history.pop();
    if (snap.currentPlayer === aiSide && history.length > 0) {
      snap = history.pop();
    }
    board = snap.board;
    currentPlayer = snap.currentPlayer;
    gameOver = false;
    overlay.classList.remove('show');
    statusLine.textContent = 'Move undone.';
    render();

    if (currentPlayer === aiSide) {
      aiThinking = true;
      setTimeout(runAITurn, 300);
    }
  }

  function newGame() {
    board = initBoard();
    currentPlayer = 'A';
    history = [];
    gameOver = false;
    aiThinking = false;
    logEl.innerHTML = '';
    overlay.classList.remove('show');

    humanSide = document.getElementById('side').value;
    aiSide = otherSide(humanSide);
    aiDepth = parseInt(document.getElementById('difficulty').value, 10);

    logMsg('A new game begins.');
    render();

    if (currentPlayer === aiSide) {
      aiThinking = true;
      statusLine.innerHTML = 'The opponent is considering <span class="thinking"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>';
      setTimeout(runAITurn, 500);
    } else {
      statusLine.textContent = 'Choose a pit to begin.';
    }
  }

  document.getElementById('newGameBtn').addEventListener('click', newGame);
  document.getElementById('undoBtn').addEventListener('click', undo);
  document.getElementById('overlayBtn').addEventListener('click', newGame);
  document.getElementById('difficulty').addEventListener('change', () => {
    aiDepth = parseInt(document.getElementById('difficulty').value, 10);
  });

  newGame();
})();
</script>

</body>
</html>
