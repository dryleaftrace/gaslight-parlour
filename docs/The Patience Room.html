<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Patience Room</title>
<style>
  :root {
    --wood-dark: #3b2417;
    --wood-mid: #5a3825;
    --wood-light: #7a4f34;
    --brass: #c8a165;
    --brass-bright: #e6c789;
    --crimson: #8e1f2b;
    --crimson-dark: #5c1219;
    --crimson-light: #b13744;
    --ebony: #1a1a1a;
    --parchment: #ece0c8;
    --felt: #0e4d33;
    --felt-light: #146043;
    --shadow: rgba(0,0,0,0.55);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: radial-gradient(ellipse at center, #2a1a10 0%, #100a06 100%);
    font-family: 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
    color: var(--parchment);
    overflow-x: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 60px;
    min-height: 100%;
  }

  .room-glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse 900px 600px at 50% 30%, rgba(200,161,101,0.08), transparent 70%);
    z-index: 0;
  }

  header { text-align: center; margin-bottom: 6px; position: relative; z-index: 1; }

  h1 {
    font-family: 'Didot', 'Bodoni MT', Georgia, serif;
    font-size: 2.6rem;
    letter-spacing: 0.12em;
    margin: 0;
    color: var(--brass-bright);
    text-shadow: 0 2px 12px rgba(200,161,101,0.35), 0 1px 0 rgba(0,0,0,0.6);
    font-weight: 400;
  }
  h1 .accent { color: var(--crimson-light); }

  .subtitle {
    margin: 6px 0 0;
    font-size: 0.85rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #a89476;
    opacity: 0.85;
  }

  .divider {
    width: 220px;
    height: 1px;
    margin: 18px auto 22px;
    background: linear-gradient(90deg, transparent, var(--brass), transparent);
    position: relative;
    z-index: 1;
  }

  .layout {
    display: flex;
    gap: 32px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
    position: relative;
    z-index: 1;
  }

  .table-frame {
    padding: 20px;
    background: linear-gradient(160deg, var(--wood-light), var(--wood-dark) 60%, #241408);
    border-radius: 10px;
    box-shadow: 0 20px 50px var(--shadow), inset 0 0 0 2px rgba(200,161,101,0.25), inset 0 0 30px rgba(0,0,0,0.5);
    position: relative;
  }

  .felt {
    background: radial-gradient(ellipse at 50% 0%, var(--felt-light), var(--felt));
    border-radius: 6px;
    padding: 22px;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(200,161,101,0.2);
  }

  .top-row {
    display: flex;
    gap: 16px;
    margin-bottom: 34px;
  }

  .pile { position: relative; width: 64px; height: 90px; flex-shrink: 0; }
  .spacer { flex: 1; min-width: 20px; }

  .pile-placeholder, .pile-empty {
    width: 100%; height: 100%;
    border: 2px dashed rgba(200,161,101,0.3);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem;
    color: rgba(200,161,101,0.3);
  }
  .pile-empty { cursor: pointer; color: var(--brass); font-size: 1.3rem; }
  .pile-empty:hover { color: var(--brass-bright); }

  .tableau-row { display: flex; gap: 16px; }
  .tcol { position: relative; width: 64px; }

  .pcard {
    position: absolute;
    top: 0; left: 0;
    width: 64px; height: 90px;
    border-radius: 6px;
    background: linear-gradient(160deg, #f5ecd8, var(--parchment) 55%, #d9c9a3);
    border: 1px solid rgba(43,26,16,0.4);
    box-shadow: 0 3px 8px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(200,161,101,0.5);
    cursor: pointer;
    user-select: none;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .pcard:hover { transform: translateY(-3px); }
  .pcard.selected {
    box-shadow: 0 0 0 3px var(--brass-bright), 0 8px 18px rgba(0,0,0,0.55);
    transform: translateY(-7px);
  }
  .pcard.red .rank, .pcard.red .suit { color: var(--crimson); }
  .pcard.black .rank, .pcard.black .suit { color: var(--ebony); }
  .pcard .rank { position: absolute; top: 4px; left: 6px; font-size: 0.92rem; font-weight: bold; line-height: 1; }
  .pcard .suit { position: absolute; top: 18px; left: 7px; font-size: 0.8rem; line-height: 1; }
  .pcard .rank.br, .pcard .suit.br { top: auto; left: auto; bottom: 4px; right: 6px; text-align: right; }
  .pcard .suit.br { bottom: 18px; }
  .pcard .pip {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem; opacity: 0.16;
  }

  .pcard.face-down {
    cursor: default;
    background: repeating-linear-gradient(45deg, var(--crimson-dark) 0 6px, #4a1016 6px 12px);
    border: 1px solid rgba(200,161,101,0.5);
    box-shadow: 0 3px 8px rgba(0,0,0,0.45), inset 0 0 0 2px rgba(200,161,101,0.35);
  }
  .pcard.face-down::after {
    content: '\2726';
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--brass); font-size: 1.2rem; opacity: 0.6;
  }
  .pcard.face-down.stock-back { cursor: pointer; }
  .pcard.face-down.stock-back:hover { transform: translateY(-3px); }

  /* --- Side panel --- */
  .panel { width: 300px; display: flex; flex-direction: column; gap: 18px; }

  .card {
    background: linear-gradient(160deg, rgba(58,36,23,0.85), rgba(20,12,7,0.9));
    border: 1px solid rgba(200,161,101,0.25);
    border-radius: 8px;
    padding: 18px 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }

  .card h2 {
    margin: 0 0 12px;
    font-size: 0.78rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--brass);
    font-weight: 400;
    border-bottom: 1px solid rgba(200,161,101,0.2);
    padding-bottom: 8px;
  }

  .stat-line { display: flex; justify-content: space-between; font-size: 0.92rem; margin-top: 8px; }
  .stat-line span.n { color: var(--brass-bright); font-weight: bold; }

  .status-line {
    margin-top: 4px;
    font-size: 0.85rem;
    color: #c9b896;
    min-height: 1.2em;
    font-style: italic;
  }

  select, button { font-family: inherit; font-size: 0.9rem; }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field label {
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #a89476;
  }

  select {
    background: #241408;
    color: var(--parchment);
    border: 1px solid rgba(200,161,101,0.35);
    border-radius: 4px;
    padding: 8px 10px;
    cursor: pointer;
  }

  .btn {
    background: linear-gradient(160deg, var(--brass-bright), var(--brass) 60%, #9c7c48);
    color: #241408;
    border: none;
    border-radius: 4px;
    padding: 10px 16px;
    cursor: pointer;
    font-weight: bold;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 0.78rem;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(0,0,0,0.5); }
  .btn:active { transform: translateY(0); }

  .btn.secondary {
    background: linear-gradient(160deg, #4a3020, #241408);
    color: var(--parchment);
    border: 1px solid rgba(200,161,101,0.3);
  }

  .btn-row { display: flex; gap: 10px; margin-top: 4px; }
  .btn-row .btn { flex: 1; }
  .btn-stack { display: flex; flex-direction: column; gap: 10px; }

  .log {
    max-height: 160px;
    overflow-y: auto;
    font-size: 0.8rem;
    color: #b8a888;
    line-height: 1.6;
    padding-right: 4px;
  }
  .log::-webkit-scrollbar { width: 5px; }
  .log::-webkit-scrollbar-thumb { background: rgba(200,161,101,0.3); border-radius: 3px; }
  .log div { border-bottom: 1px dotted rgba(200,161,101,0.12); padding: 2px 0; }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(10,6,3,0.82);
    display: none; align-items: center; justify-content: center;
    z-index: 10;
  }
  .overlay.show { display: flex; }
  .overlay-card {
    background: linear-gradient(160deg, var(--wood-light), var(--wood-dark) 70%);
    border: 1px solid var(--brass);
    border-radius: 10px;
    padding: 40px 50px;
    text-align: center;
    box-shadow: 0 30px 80px rgba(0,0,0,0.7);
  }
  .overlay-card h2 { color: var(--brass-bright); font-size: 1.8rem; margin: 0 0 8px; letter-spacing: 0.05em; font-weight: 400; }
  .overlay-card p { color: #c9b896; margin: 0 0 22px; font-style: italic; }

  footer {
    margin-top: 26px;
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #6a5a44;
    position: relative;
    z-index: 1;
  }

  @media (max-width: 720px) {
    .layout { flex-direction: column; align-items: center; }
    .panel { width: 100%; max-width: 420px; }
  }
  @media (max-width: 560px) {
    .top-row { flex-wrap: wrap; gap: 10px; }
    .tableau-row { gap: 8px; }
    .pile, .tcol { width: 44px; }
    .pcard { width: 44px; height: 62px; }
    .pcard .pip { font-size: 1.4rem; }
  }
</style>
</head>
<body>

<div class="room-glow"></div>

<header>
  <h1>The <span class="accent">Patience</span> Room</h1>
  <p class="subtitle">Klondike, Played by Gaslight</p>
</header>
<div class="divider"></div>

<div class="layout">
  <div class="table-frame">
    <div class="felt">
      <div class="top-row">
        <div class="pile" id="stockPile"></div>
        <div class="pile" id="wastePile"></div>
        <div class="spacer"></div>
        <div class="pile foundation" id="foundationS"></div>
        <div class="pile foundation" id="foundationH"></div>
        <div class="pile foundation" id="foundationD"></div>
        <div class="pile foundation" id="foundationC"></div>
      </div>
      <div class="tableau-row" id="tableauRow"></div>
    </div>
  </div>

  <div class="panel">
    <div class="card">
      <h2>The Table</h2>
      <div class="status-line" id="statusLine">Choose a card to begin.</div>
      <div class="stat-line"><span>Moves</span><span class="n" id="moveCount">0</span></div>
      <div class="stat-line"><span>Time</span><span class="n" id="timeDisplay">0:00</span></div>
      <div class="stat-line"><span>Foundation</span><span class="n" id="foundationCount">0 / 52</span></div>
    </div>

    <div class="card">
      <h2>House Rules</h2>
      <div class="field">
        <label for="drawMode">Draw</label>
        <select id="drawMode">
          <option value="1">Draw One</option>
          <option value="3" selected>Draw Three</option>
        </select>
      </div>
      <div class="btn-stack">
        <div class="btn-row">
          <button class="btn" id="newGameBtn">New Game</button>
          <button class="btn secondary" id="undoBtn">Undo</button>
        </div>
        <button class="btn secondary" id="autoFinishBtn">Auto-Finish</button>
      </div>
    </div>

    <div class="card">
      <h2>The Ledger</h2>
      <div class="log" id="log"></div>
    </div>
  </div>
</div>

<footer>Est. this evening &middot; Klondike, Standard Rules</footer>

<div class="overlay" id="overlay">
  <div class="overlay-card">
    <h2 id="overlayTitle">The Table Is Cleared</h2>
    <p id="overlayText">Fifty-two cards, home at last.</p>
    <button class="btn" id="overlayBtn">Play Again</button>
  </div>
</div>

<script>
(function() {
  'use strict';

  const SUITS = ['S','H','D','C'];
  function suitGlyph(s) { return { S:'♠', H:'♥', D:'♦', C:'♣' }[s]; }
  function rankLabel(r) { if (r===1) return 'A'; if (r===11) return 'J'; if (r===12) return 'Q'; if (r===13) return 'K'; return String(r); }
  function isRed(card) { return card.suit === 'H' || card.suit === 'D'; }
  function cardLabel(card) { return rankLabel(card.rank) + suitGlyph(card.suit); }

  let stock = [], waste = [], foundations = {}, tableau = [];
  let selection = null;
  let history = [];
  let moveCount = 0;
  let elapsedSeconds = 0;
  let gameWon = false;
  let timerInterval = null;

  const stockEl = document.getElementById('stockPile');
  const wasteEl = document.getElementById('wastePile');
  const tableauRow = document.getElementById('tableauRow');
  const statusLine = document.getElementById('statusLine');
  const moveCountEl = document.getElementById('moveCount');
  const timeDisplay = document.getElementById('timeDisplay');
  const foundationCountEl = document.getElementById('foundationCount');
  const logEl = document.getElementById('log');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');

  function drawCountSetting() { return parseInt(document.getElementById('drawMode').value, 10); }

  function buildDeck() {
    const deck = [];
    for (const s of SUITS) for (let r = 1; r <= 13; r++) deck.push({ suit: s, rank: r });
    return deck;
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  function logMsg(msg) {
    const div = document.createElement('div');
    div.textContent = msg;
    logEl.insertBefore(div, logEl.firstChild);
  }

  function newGame() {
    clearInterval(timerInterval);
    const deck = buildDeck();
    shuffle(deck);
    tableau = Array.from({ length: 7 }, () => []);
    for (let col = 0; col < 7; col++) {
      for (let i = 0; i <= col; i++) {
        const card = deck.pop();
        tableau[col].push({ suit: card.suit, rank: card.rank, faceUp: i === col });
      }
    }
    stock = deck.map(c => ({ suit: c.suit, rank: c.rank, faceUp: false }));
    waste = [];
    foundations = { S: [], H: [], D: [], C: [] };
    selection = null;
    history = [];
    moveCount = 0;
    elapsedSeconds = 0;
    gameWon = false;
    overlay.classList.remove('show');
    logEl.innerHTML = '';
    logMsg('A fresh deck is laid. Patience begins.');
    render();
    updateTimer();
    timerInterval = setInterval(() => {
      if (!gameWon) { elapsedSeconds++; updateTimer(); }
    }, 1000);
  }

  function snapshot() {
    return JSON.parse(JSON.stringify({ stock, waste, foundations, tableau, moveCount }));
  }
  function pushHistory() {
    history.push(snapshot());
    if (history.length > 300) history.shift();
  }
  function undo() {
    if (gameWon || history.length === 0) return;
    const snap = history.pop();
    stock = snap.stock; waste = snap.waste; foundations = snap.foundations; tableau = snap.tableau; moveCount = snap.moveCount;
    selection = null;
    statusLine.textContent = 'Move undone.';
    render();
  }

  function flipExposedTops() {
    for (const col of tableau) {
      if (col.length > 0 && !col[col.length - 1].faceUp) col[col.length - 1].faceUp = true;
    }
  }

  function onStockClick() {
    if (gameWon) return;
    pushHistory();
    if (stock.length === 0) {
      if (waste.length === 0) { history.pop(); return; }
      stock = waste.slice().reverse().map(c => ({ suit: c.suit, rank: c.rank, faceUp: false }));
      waste = [];
      logMsg('The waste is turned back into stock.');
    } else {
      const n = Math.min(drawCountSetting(), stock.length);
      for (let i = 0; i < n; i++) {
        const c = stock.pop();
        c.faceUp = true;
        waste.push(c);
      }
      moveCount++;
    }
    selection = null;
    render();
  }

  function getSelectedCards() {
    if (!selection) return [];
    if (selection.source === 'tableau') return tableau[selection.col].slice(selection.cardIndex);
    if (selection.source === 'waste') return waste.length ? [waste[waste.length - 1]] : [];
    if (selection.source === 'foundation') {
      const p = foundations[selection.suit];
      return p.length ? [p[p.length - 1]] : [];
    }
    return [];
  }

  function removeSelectionFromSource() {
    if (selection.source === 'tableau') tableau[selection.col] = tableau[selection.col].slice(0, selection.cardIndex);
    else if (selection.source === 'waste') waste.pop();
    else if (selection.source === 'foundation') foundations[selection.suit].pop();
  }

  function tryMoveSelectionTo(dest) {
    const cards = getSelectedCards();
    if (cards.length === 0) return false;
    const moving = cards[0];

    if (dest.type === 'tableau') {
      if (selection.source === 'tableau' && selection.col === dest.col) { selection = null; render(); return false; }
      const destCol = tableau[dest.col];
      const top = destCol.length ? destCol[destCol.length - 1] : null;
      const valid = top ? (isRed(moving) !== isRed(top) && moving.rank === top.rank - 1) : moving.rank === 13;
      if (!valid) return false;
      pushHistory();
      removeSelectionFromSource();
      for (const c of cards) { c.faceUp = true; destCol.push(c); }
      moveCount++;
      flipExposedTops();
      logMsg((cards.length > 1 ? cards.length + ' cards' : cardLabel(moving)) + ' moved to column ' + (dest.col + 1) + '.');
      selection = null;
      render();
      checkWin();
      return true;
    }

    if (dest.type === 'foundation') {
      if (cards.length !== 1) return false;
      const pile = foundations[dest.suit];
      const valid = moving.suit === dest.suit && (pile.length ? moving.rank === pile[pile.length - 1].rank + 1 : moving.rank === 1);
      if (!valid) return false;
      pushHistory();
      removeSelectionFromSource();
      pile.push(moving);
      moveCount++;
      flipExposedTops();
      logMsg(cardLabel(moving) + ' sent home to the foundation.');
      selection = null;
      render();
      checkWin();
      return true;
    }
    return false;
  }

  function onTableauCardClick(colIndex, cardIndex) {
    if (gameWon) return;
    const card = tableau[colIndex][cardIndex];
    if (!card.faceUp) return;
    if (selection && selection.source === 'tableau' && selection.col === colIndex && selection.cardIndex === cardIndex) {
      selection = null; render(); return;
    }
    if (selection) {
      const moved = tryMoveSelectionTo({ type: 'tableau', col: colIndex });
      if (moved) return;
    }
    selection = { source: 'tableau', col: colIndex, cardIndex };
    render();
  }

  function onTableauColumnClick(colIndex) {
    if (gameWon || !selection) return;
    tryMoveSelectionTo({ type: 'tableau', col: colIndex });
  }

  function onWasteClick() {
    if (gameWon || waste.length === 0) return;
    if (selection && selection.source === 'waste') { selection = null; render(); return; }
    selection = { source: 'waste' };
    render();
  }

  function onFoundationClick(suit) {
    if (gameWon) return;
    const pile = foundations[suit];
    if (selection) {
      const moved = tryMoveSelectionTo({ type: 'foundation', suit });
      if (moved) return;
    }
    if (selection && selection.source === 'foundation' && selection.suit === suit) { selection = null; render(); return; }
    if (pile.length > 0) {
      selection = { source: 'foundation', suit };
      render();
    }
  }

  function onCardDoubleClick(source) {
    let card;
    if (source.source === 'waste') card = waste.length ? waste[waste.length - 1] : null;
    else if (source.source === 'tableau') {
      const col = tableau[source.col];
      card = (source.cardIndex === col.length - 1) ? col[col.length - 1] : null;
    }
    if (!card) return;
    for (const suit of SUITS) {
      const pile = foundations[suit];
      const valid = card.suit === suit && (pile.length ? card.rank === pile[pile.length - 1].rank + 1 : card.rank === 1);
      if (valid) {
        selection = source;
        tryMoveSelectionTo({ type: 'foundation', suit });
        return;
      }
    }
  }

  function checkWin() {
    const total = SUITS.reduce((n, s) => n + foundations[s].length, 0);
    if (total === 52) {
      gameWon = true;
      clearInterval(timerInterval);
      logMsg('— The table is cleared —');
      overlayTitle.textContent = 'The Table Is Cleared';
      overlayText.textContent = 'Fifty-two cards, home at last — in ' + moveCount + ' moves and ' + formatTime(elapsedSeconds) + '.';
      overlay.classList.add('show');
      render();
    }
  }

  function autoFinish() {
    if (gameWon) return;
    let progressed = true;
    let guard = 0;
    while (progressed && guard < 500) {
      progressed = false;
      guard++;
      if (waste.length) {
        const card = waste[waste.length - 1];
        for (const suit of SUITS) {
          const pile = foundations[suit];
          if (card.suit === suit && (pile.length ? card.rank === pile[pile.length - 1].rank + 1 : card.rank === 1)) {
            selection = { source: 'waste' };
            tryMoveSelectionTo({ type: 'foundation', suit });
            progressed = true;
            break;
          }
        }
      }
      if (progressed) continue;
      for (let ci = 0; ci < 7; ci++) {
        const col = tableau[ci];
        if (!col.length) continue;
        const card = col[col.length - 1];
        if (!card.faceUp) continue;
        let moved = false;
        for (const suit of SUITS) {
          const pile = foundations[suit];
          if (card.suit === suit && (pile.length ? card.rank === pile[pile.length - 1].rank + 1 : card.rank === 1)) {
            selection = { source: 'tableau', col: ci, cardIndex: col.length - 1 };
            tryMoveSelectionTo({ type: 'foundation', suit });
            moved = true; progressed = true;
            break;
          }
        }
        if (moved) break;
      }
    }
    selection = null;
    render();
  }

  function renderCardEl(card, faceUp) {
    const el = document.createElement('div');
    if (!faceUp) { el.className = 'pcard face-down'; return el; }
    const red = isRed(card);
    el.className = 'pcard ' + (red ? 'red' : 'black');
    const rl = rankLabel(card.rank);
    const sg = suitGlyph(card.suit);
    el.innerHTML =
      '<span class="rank">' + rl + '</span><span class="suit">' + sg + '</span>' +
      '<span class="pip">' + sg + '</span>' +
      '<span class="rank br">' + rl + '</span><span class="suit br">' + sg + '</span>';
    return el;
  }

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function updateTimer() { timeDisplay.textContent = formatTime(elapsedSeconds); }

  function updateCounters() {
    moveCountEl.textContent = moveCount;
    const total = SUITS.reduce((n, s) => n + foundations[s].length, 0);
    foundationCountEl.textContent = total + ' / 52';
  }

  function render() {
    stockEl.innerHTML = '';
    if (stock.length > 0) {
      const back = renderCardEl(null, false);
      back.classList.add('stock-back');
      back.onclick = onStockClick;
      stockEl.appendChild(back);
    } else {
      const empty = document.createElement('div');
      empty.className = 'pile-empty';
      empty.textContent = waste.length ? '↺' : '';
      empty.onclick = onStockClick;
      stockEl.appendChild(empty);
    }

    wasteEl.innerHTML = '';
    const showCount = Math.min(drawCountSetting(), waste.length, 3);
    for (let i = waste.length - showCount; i < waste.length; i++) {
      const el = renderCardEl(waste[i], true);
      el.style.left = ((i - (waste.length - showCount)) * 16) + 'px';
      el.style.zIndex = i;
      if (i === waste.length - 1) {
        el.classList.toggle('selected', !!(selection && selection.source === 'waste'));
        el.onclick = (e) => { e.stopPropagation(); onWasteClick(); };
        el.ondblclick = (e) => { e.stopPropagation(); onCardDoubleClick({ source: 'waste' }); };
      } else {
        el.style.cursor = 'default';
      }
      wasteEl.appendChild(el);
    }

    for (const suit of SUITS) {
      const el = document.getElementById('foundation' + suit);
      el.innerHTML = '';
      const pile = foundations[suit];
      if (pile.length) {
        const top = renderCardEl(pile[pile.length - 1], true);
        top.classList.toggle('selected', !!(selection && selection.source === 'foundation' && selection.suit === suit));
        top.onclick = (e) => { e.stopPropagation(); onFoundationClick(suit); };
        el.appendChild(top);
      } else {
        const ph = document.createElement('div');
        ph.className = 'pile-placeholder';
        ph.textContent = suitGlyph(suit);
        el.appendChild(ph);
      }
      el.onclick = () => onFoundationClick(suit);
    }

    tableauRow.innerHTML = '';
    tableau.forEach((col, ci) => {
      const colEl = document.createElement('div');
      colEl.className = 'tcol';
      colEl.style.minHeight = (90 + Math.max(col.length - 1, 0) * 24) + 'px';
      colEl.onclick = (e) => { if (e.target === colEl) onTableauColumnClick(ci); };
      col.forEach((card, idx) => {
        const el = renderCardEl(card, card.faceUp);
        el.style.top = (idx * 24) + 'px';
        el.style.zIndex = idx;
        if (card.faceUp) {
          const isSelected = !!(selection && selection.source === 'tableau' && selection.col === ci && idx >= selection.cardIndex);
          el.classList.toggle('selected', isSelected);
          el.onclick = (e) => { e.stopPropagation(); onTableauCardClick(ci, idx); };
          if (idx === col.length - 1) {
            el.ondblclick = (e) => { e.stopPropagation(); onCardDoubleClick({ source: 'tableau', col: ci, cardIndex: idx }); };
          }
        } else {
          el.style.cursor = 'default';
        }
        colEl.appendChild(el);
      });
      tableauRow.appendChild(colEl);
    });

    updateCounters();
    if (!gameWon) {
      statusLine.textContent = selection ? 'Choose a destination.' : 'Choose a card to begin.';
    }
  }

  document.getElementById('newGameBtn').addEventListener('click', newGame);
  document.getElementById('undoBtn').addEventListener('click', undo);
  document.getElementById('autoFinishBtn').addEventListener('click', autoFinish);
  document.getElementById('overlayBtn').addEventListener('click', newGame);

  newGame();
})();
</script>

</body>
</html>
